# File: templates/layout.html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Bank Productivity Tracker</title>
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet" />
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <!-- Roboto font -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="d-flex" id="wrapper">
        <nav id="sidebar" class="bg-light border-end">
            <div class="sidebar-heading px-3 py-2">AI Bank Tracker</div>
            <div class="list-group list-group-flush">
                <a href="{{ url_for('dashboard') }}" class="list-group-item list-group-item-action d-flex align-items-center">
                    <span class="material-icons me-2">dashboard</span> Dashboard
                </a>
                <a href="{{ url_for('projects') }}" class="list-group-item list-group-item-action d-flex align-items-center">
                    <span class="material-icons me-2">folder_open</span> Projects
                </a>
            </div>
        </nav>

        <div id="page-content-wrapper" class="flex-grow-1 d-flex flex-column">
            <header class="bg-primary text-white p-3 d-flex align-items-center">
                <button class="btn btn-primary me-3" id="sidebarToggle" aria-label="Toggle sidebar">
                    <span class="material-icons">menu</span>
                </button>
                <h1 class="h5 m-0">AI Bank Productivity Tracker</h1>
            </header>

            <main class="container-fluid flex-grow-1 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

<script>
    // Sidebar toggle
    document.getElementById('sidebarToggle').addEventListener('click', function() {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });
</script>

</body>
</html>
